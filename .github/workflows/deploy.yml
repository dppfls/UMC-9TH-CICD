name: CI/CD Deploy to EC2

on:
  push:
    branches:
      - yerin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle Wrapper 실행 권한
      - name: Give execute permission to gradlew
        run: chmod +x ./gradlew

      # 4. Gradle Build (테스트 제외)
      - name: Build Spring Boot Application
        run: ./gradlew clean build -x test

      # 5. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Docker 이미지 빌드 & 푸시
      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
          echo "IMAGE_NAME=$IMAGE_NAME"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      # 7. EC2에 SSH 접속 & 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "====== EC2 배포 시작 ======"

            cd ~/UMC_9TH_CICD

            echo "===== Git 최신 코드 가져오기 ====="
            git fetch --all
            git reset --hard origin/yerin

            echo "===== .env 파일 생성 ====="
            cat > .env <<EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_ROOT_PW=${{ secrets.DB_ROOT_PW }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PW=${{ secrets.DB_PW }}
  
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_EXPIRATION_ACCESS=${{ secrets.JWT_EXPIRATION_ACCESS }}
            JWT_EXPIRATION_REFRESH=${{ secrets.JWT_EXPIRATION_REFRESH }}
  
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
            EOF
  
            echo "===== 새 Docker 이미지 Pull ====="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
  
            echo "===== 기존 컨테이너 중지 및 제거 ====="
            docker-compose --env-file .env down || true
  
            echo "===== 새로운 컨테이너 실행 ====="
            docker-compose --env-file .env up -d
  
            echo "===== 실행 중 컨테이너 확인 ====="
            docker ps -a
  
            echo "===== 배포 완료 ====="
